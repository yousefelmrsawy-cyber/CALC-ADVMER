<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <label class="toggle-switch">
                <input type="checkbox" id="theme-toggle" aria-label="Toggle theme">
                <div class="toggle-switch-background">
                    <div class="toggle-switch-handle">
                        <svg class="handle-icon sun-icon" viewBox="0 0 24 24" width="16" height="16" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4.5" fill="#f59e0b"></circle>
                            <line x1="12" y1="1.5" x2="12" y2="3.5"></line>
                            <line x1="12" y1="20.5" x2="12" y2="22.5"></line>
                            <line x1="4.5" y1="4.5" x2="6" y2="6"></line>
                            <line x1="18" y1="18" x2="19.5" y2="19.5"></line>
                            <line x1="1.5" y1="12" x2="3.5" y2="12"></line>
                            <line x1="20.5" y1="12" x2="22.5" y2="12"></line>
                            <line x1="4.5" y1="19.5" x2="6" y2="18"></line>
                            <line x1="18" y1="6" x2="19.5" y2="4.5"></line>
                        </svg>
                        <svg class="handle-icon moon-icon" viewBox="0 0 24 24" width="15" height="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </div>
                </div>
            </label>
        </div>
        <div class="screen">
            <p>0</p>
        </div>
        <div class="keys"></div>
    </div>
    <script src="back.js"></script>
</body>
</html>
